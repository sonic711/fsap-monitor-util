# 部署與業務設定：修改後重新啟動 Web 或重新執行 CLI，不需重打 JAR。
server:
  port: 8080

spring:
  thymeleaf:
    cache: false
  servlet:
    multipart:
      max-file-size: 200MB
      max-request-size: 200MB
      # location: /app/fsap-monitor-util/upload-tmp

# 既有 SFTP 連線值原樣保留；部署時請使用目標環境的設定。
remote:
  url: sftp://10.1.11.47:22
  username: fsap
  code: 3UW75j3foLgKFSre9AvFfVDS1bavH5JV
  defPath: FSAP/

fsap:
  paths:
    base-dir: .
    database-file: 05_database/fsap-month-report.duckdb
    log-dir: logs
  ingest:
    target-sheets:
      - RT_CNT
      - RT_TMSPT
      - RT_PR_HH24
      - RT_NODE_HH24
      - BT_CNT
      - MON_LOG
      - ERR_LOG
      - PR_CFG
    filename-pattern: "FSAP每日交易統計(\\d{8})\\.xlsx"
  report:
    target-bzkinds:
      - NCL
      - NCB
      - FAS
      - NIS
      - FSAP
    combined-workbook:
      all-sheets:
        - sheet-name: 總覽-交易量統計
          data-source: 1.交易量統計-當月.csv
        - sheet-name: 總覽-CPU-MEM峰日峰時
          data-source: 1.1.2. CPU-MEM監控-峰日峰時.csv
        - sheet-name: 總覽-當月每日
          data-source: 2.1.交易量統計-當月每日-Pivot.csv
        - sheet-name: 總覽-峰日峰時
          data-source: 3.1.交易量統計-峰日峰時-Pivot.csv
        - sheet-name: 總覽-歷史月總量
          data-source: 4.交易量統計-歷史月總量.csv
        - sheet-name: 總覽-歷史峰日
          data-source: 5.1.交易量統計-歷史峰日-Pivot.csv
        - sheet-name: 總覽-歷史峰日峰時
          data-source: 6.1.交易量統計-歷史峰日峰時-Pivot.csv
        - sheet-name: 總覽-TOP6交易類
          data-source: 7.1.交易量統計-TOP6交易類.csv
        - sheet-name: 總覽-TOP6查詢類
          data-source: 7.2.交易量統計-TOP6查詢類.csv
        - sheet-name: 總覽-MOM交易量比較
          data-source: 8.3.交易量統計-MOM交易量比較.csv
      bzkinds:
        - NCL
        - NCB
        - FAS
        - NIS
        - FSAP
      reports:
        - sheet-name: "{pr_bzkind}-交易量統計"
          data-source: 1.交易量統計-當月.csv
        - sheet-name: "{pr_bzkind}-當月每日"
          data-source: 2.1.交易量統計-當月每日-Pivot.csv
        - sheet-name: "{pr_bzkind}-峰日峰時"
          data-source: 3.1.交易量統計-峰日峰時-Pivot.csv
        - sheet-name: "{pr_bzkind}-歷史峰日"
          data-source: 5.1.交易量統計-歷史峰日-Pivot.csv
        - sheet-name: "{pr_bzkind}-歷史峰日峰時"
          data-source: 6.1.交易量統計-歷史峰日峰時-Pivot.csv
        - sheet-name: "{pr_bzkind}-TOP6交易類"
          data-source: 7.1.交易量統計-TOP6交易類.csv
        - sheet-name: "{pr_bzkind}-TOP6查詢類"
          data-source: 7.2.交易量統計-TOP6查詢類.csv
        - sheet-name: "{pr_bzkind}-所有交易類別"
          data-source: 7.交易量統計-所有交易類別.csv
  web:
    readonly: false
  monitor:
    config-file: config/monitor-data.json
